# Production on the VPS: Caddy (on the host) terminates HTTPS for app.orbytlink.com and
# proxies to 127.0.0.1:3080. The port is bound to loopback, so the app is reachable only
# through Caddy. Configuration lives in .env next to this file (see .env.production.example).
#   docker compose -f deploy-compose.yml up -d --build
# Its own project name, so its volumes never collide with the retired "orbytlink" stack's.
name: orbytlink-gateway
services:
  api:
    build: .
    image: orbytlink:latest
    container_name: OrbytLink-API
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3100"
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3080:3100"
    volumes:
      - orbytlink-data:/app/data
      - orbytlink-backups:/app/backups
    # Lets in-flight tool calls (up to two minutes) finish on deploy.
    stop_grace_period: 135s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  # The scraper that comes with OrbytLink: a stealth Chromium for pages that block plain requests,
  # and for Google Maps. Reachable only from the api container. Needs SCRAPER_URL=http://scraper:8700
  # and SCRAPER_TOKEN in .env; without them the scraper still reads pages with plain requests.
  scraper:
    build: ./scraper
    container_name: OrbytLink-Scraper
    restart: unless-stopped
    environment:
      SCRAPER_TOKEN: ${SCRAPER_TOKEN}
      SCRAPER_CONCURRENCY: ${SCRAPER_CONCURRENCY:-3}
      SCRAPER_SESSIONS: ${SCRAPER_SESSIONS:-3}
    shm_size: 1gb
    mem_limit: 2g
    expose: ["8700"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  orbytlink-data:
  orbytlink-backups:
