# Production on the VPS: Caddy (on the host) terminates HTTPS for app.orbytlink.com and
# proxies to 127.0.0.1:3080. The port is bound to loopback, so the app is reachable only
# through Caddy. Configuration lives in .env next to this file (see .env.production.example).
#   docker compose -f deploy-compose.yml up -d --build
# Its own project name, so its volumes never collide with the retired "orbytlink" stack's.
name: orbytlink-gateway
services:
  api:
    build: .
    image: orbytlink:latest
    container_name: OrbytLink-API
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3100"
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3080:3100"
    volumes:
      - orbytlink-data:/app/data
      - orbytlink-backups:/app/backups
    # Lets in-flight tool calls (up to two minutes) finish on deploy.
    stop_grace_period: 135s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  orbytlink-data:
  orbytlink-backups:
