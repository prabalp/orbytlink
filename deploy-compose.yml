# Production on the VPS: Caddy (on the host) terminates HTTPS for app.orbytlink.com and
# proxies to 127.0.0.1:3080. The port is bound to loopback, so the app is reachable only
# through Caddy. Configuration lives in .env next to this file (see .env.production.example).
#   docker compose -f deploy-compose.yml up -d --build
# Its own project name, so its volumes never collide with the retired "orbytlink" stack's.
name: orbytlink-gateway
services:
  api:
    build: .
    image: orbytlink:latest
    container_name: OrbytLink-API
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3100"
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3080:3100"
    volumes:
      - orbytlink-data:/app/data
      - orbytlink-backups:/app/backups
    # Lets in-flight tool calls (up to two minutes) finish on deploy.
    stop_grace_period: 135s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  # Optional: a web browser for tasks with no API or MCP. Reachable only from the api container.
  # Set BROWSER_URL=http://browser:8800, BROWSER_TOKEN and TYPESAFE_API_KEY in .env; the text helper
  # reuses AI_GATEWAY_API_KEY. Leave BROWSER_URL unset to keep the feature off.
  browser:
    build: ./browser
    container_name: OrbytLink-Browser
    restart: unless-stopped
    profiles: ["browser"]
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN}
      # Jev's action model is TypeSafe's own hosted model, so it needs its own key.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY}
      # Jev's text helper goes through the same Vercel AI Gateway key OrbytLink already uses.
      TEXT_MODEL_API_KEY: ${AI_GATEWAY_API_KEY}
      TEXT_MODEL_BASE_URL: ${AI_GATEWAY_URL:-https://ai-gateway.vercel.sh/v1}
      TEXT_MODEL: ${BROWSER_TEXT_MODEL:-openai/gpt-5-mini}
    shm_size: 1gb
    mem_limit: 2g
    expose: ["8800"]
volumes:
  orbytlink-data:
  orbytlink-backups:
